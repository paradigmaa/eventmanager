version: '3.7'

services:

  postgres-manager:
    image: postgres:15
    container_name: event-manager-base
    environment:
      POSTGRES_DB: event-manager-db
      POSTGRES_USER: event-manager-db
      POSTGRES_PASSWORD: event-manager-db
    ports:
      - "5432:5432"
  postgres-notificator:
    image: postgres:15
    container_name: event-notificator-base
    environment:
      POSTGRES_DB: event-notificator-db
      POSTGRES_USER: event-notificator-db
      POSTGRES_PASSWORD: event-notificator-db
    ports:
      - "5433:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      - "9092:9092"